# Website (https://r-m-r-race.netlify.app/): single player, story, garage, online multiplayer.
# The online server is a Cloudflare Worker (see ONLINE_MULTIPLAYER.md). Its address is VITE_MULTIPLAYER_URL below
# (not a secret: it is visible in the public site anyway). A variable with the same name set in the Netlify UI
# takes precedence. Without it the site works, but says that the online server is not connected yet.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Electron is only needed for the desktop app: do not download its ~100 MB binary on Netlify
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
  VITE_MULTIPLAYER_URL = "https://rmr-race-online.rmr-race-online.workers.dev"
