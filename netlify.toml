# Web version (https://r-m-r-race.netlify.app/): single player, story, garage. LAN multiplayer runs
# on the organizer's computer (npm start); an HTTPS page cannot reach it, so the web version only
# explains how to open the organizer's address.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Electron is only needed for the desktop app: do not download its ~100 MB binary on Netlify
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
